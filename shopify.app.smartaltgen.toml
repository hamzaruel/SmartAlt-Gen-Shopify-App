client_id = "b10241a4d21315935f4ba147f5d5754a"
name = "Alt Text Pro"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-01"

  # Compliance webhooks disabled for local dev (--use-localhost): a localhost URI
  # is rejected by Shopify as an internal domain and blocks the dev preview.
  # These live in Aoun's deploy toml (shopify.app.toml) for the App Store; this
  # local toml is never deployed. Re-enable if you ever deploy from this toml.
  # [[webhooks.subscriptions]]
  # compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  # uri = "/api/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,write_files,read_products,write_products,read_content,write_content"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[build]
automatically_update_urls_on_dev = true
